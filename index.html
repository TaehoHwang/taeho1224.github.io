<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="About Your Name.">
  <title>Your Name | About</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #202530;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 64px 24px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 16px;
    }

    @media (max-width: 540px) {
      main {
        padding-top: 40px;
      }
    }
  </style>
</head>

<body>
  <main>
    <section id="about" aria-labelledby="about-heading">
      <h1 id="about-heading">About</h1>
      <p>
        Hello! I am [Your Name], a [position] at [organization].
        My work focuses on [your field or area of expertise].
        I am interested in [brief description of your interests].
      </p>
      <p>
        <strong>Research interests:</strong>
        [Topic 1], [Topic 2], and [Topic 3].
      </p>
    </section>
  </main>
</body>
</html>
